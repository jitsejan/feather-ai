# Chart Definitions for Superset Dashboards
# These will be created programmatically via the import script

dashboards:
  - name: "Executive Overview"
    description: "Main dashboard with KPIs and overview charts"
    charts:
      - name: "Total Issues"
        type: "big_number"
        dataset: "user_insights"
        query: |
          SELECT SUM(issues_assigned) as value
          FROM gold.user_insights
          WHERE assignee IS NOT NULL
        position: {x: 0, y: 0, w: 3, h: 4}
      
      - name: "Completed Issues"
        type: "big_number"
        dataset: "user_insights"
        query: |
          SELECT SUM(issues_completed) as value
          FROM gold.user_insights
          WHERE assignee IS NOT NULL
        position: {x: 3, y: 0, w: 3, h: 4}
      
      - name: "Completion Rate"
        type: "big_number"
        dataset: "user_insights"
        query: |
          SELECT ROUND(100.0 * SUM(issues_completed) / NULLIF(SUM(issues_assigned), 0), 1) as value
          FROM gold.user_insights
          WHERE assignee IS NOT NULL
        position: {x: 6, y: 0, w: 3, h: 4}
      
      - name: "Active Team Members"
        type: "big_number"
        dataset: "user_insights"
        query: |
          SELECT COUNT(DISTINCT assignee) as value
          FROM gold.user_insights
          WHERE assignee IS NOT NULL
        position: {x: 9, y: 0, w: 3, h: 4}
      
      - name: "Sprint Velocity Trend"
        type: "line"
        dataset: "sprint_velocity"
        query: |
          SELECT sprint_name, issues_completed
          FROM gold.sprint_velocity
          ORDER BY start_date ASC
        metrics: ["issues_completed"]
        group_by: ["sprint_name"]
        position: {x: 0, y: 4, w: 6, h: 8}
      
      - name: "Committed vs Completed"
        type: "bar"
        dataset: "sprint_velocity"
        query: |
          SELECT sprint_name, issues_committed, issues_completed
          FROM gold.sprint_velocity
          ORDER BY start_date ASC
        metrics: ["issues_committed", "issues_completed"]
        group_by: ["sprint_name"]
        position: {x: 6, y: 4, w: 6, h: 8}
      
      - name: "Team Performance"
        type: "bar"
        dataset: "user_insights"
        query: |
          SELECT assignee, issues_completed
          FROM gold.user_insights
          WHERE assignee IS NOT NULL
          ORDER BY issues_assigned DESC
        metrics: ["issues_completed"]
        group_by: ["assignee"]
        position: {x: 0, y: 12, w: 6, h: 8}
      
      - name: "Ticket Aging"
        type: "bar"
        dataset: "ticket_aging"
        query: |
          SELECT 
            CASE
              WHEN days_in_status < 7 THEN '< 1 week'
              WHEN days_in_status < 30 THEN '1-4 weeks'
              WHEN days_in_status < 90 THEN '1-3 months'
              ELSE '> 3 months'
            END AS age_bucket,
            COUNT(*) AS ticket_count
          FROM gold.ticket_aging
          GROUP BY 1
          ORDER BY MIN(days_in_status)
        metrics: ["ticket_count"]
        group_by: ["age_bucket"]
        position: {x: 6, y: 12, w: 6, h: 8}

  - name: "Sprint Analytics"
    description: "Sprint performance and velocity analysis"
    charts:
      - name: "Total Sprints"
        type: "big_number"
        dataset: "sprint_velocity"
        query: |
          SELECT COUNT(*) as value
          FROM gold.sprint_velocity
        position: {x: 0, y: 0, w: 3, h: 4}
      
      - name: "Avg Completion Rate"
        type: "big_number"
        dataset: "sprint_velocity"
        query: |
          SELECT ROUND(AVG(completion_ratio) * 100, 1) as value
          FROM gold.sprint_velocity
        position: {x: 3, y: 0, w: 3, h: 4}
      
      - name: "Avg Velocity"
        type: "big_number"
        dataset: "sprint_velocity"
        query: |
          SELECT ROUND(AVG(issues_completed), 1) as value
          FROM gold.sprint_velocity
        position: {x: 6, y: 0, w: 3, h: 4}
      
      - name: "Best Velocity"
        type: "big_number"
        dataset: "sprint_velocity"
        query: |
          SELECT MAX(issues_completed) as value
          FROM gold.sprint_velocity
        position: {x: 9, y: 0, w: 3, h: 4}
      
      - name: "Velocity Trends"
        type: "line"
        dataset: "sprint_velocity"
        query: |
          SELECT sprint_name, issues_committed, issues_completed
          FROM gold.sprint_velocity
          ORDER BY start_date ASC
        metrics: ["issues_committed", "issues_completed"]
        group_by: ["sprint_name"]
        position: {x: 0, y: 4, w: 12, h: 8}
      
      - name: "Completion Rate by Sprint"
        type: "bar"
        dataset: "sprint_velocity"
        query: |
          SELECT sprint_name, completion_ratio
          FROM gold.sprint_velocity
          ORDER BY start_date ASC
        metrics: ["completion_ratio"]
        group_by: ["sprint_name"]
        position: {x: 0, y: 12, w: 12, h: 8}

  - name: "Team Performance"
    description: "Team member metrics and insights"
    charts:
      - name: "Team Size"
        type: "big_number"
        dataset: "user_insights"
        query: |
          SELECT COUNT(DISTINCT assignee) as value
          FROM gold.user_insights
          WHERE assignee IS NOT NULL
        position: {x: 0, y: 0, w: 3, h: 4}
      
      - name: "Total Workload"
        type: "big_number"
        dataset: "user_insights"
        query: |
          SELECT SUM(issues_assigned) as value
          FROM gold.user_insights
          WHERE assignee IS NOT NULL
        position: {x: 3, y: 0, w: 3, h: 4}
      
      - name: "Avg per Person"
        type: "big_number"
        dataset: "user_insights"
        query: |
          SELECT ROUND(AVG(issues_assigned), 1) as value
          FROM gold.user_insights
          WHERE assignee IS NOT NULL
        position: {x: 6, y: 0, w: 3, h: 4}
      
      - name: "Team Completion"
        type: "big_number"
        dataset: "user_insights"
        query: |
          SELECT ROUND(100.0 * SUM(issues_completed) / NULLIF(SUM(issues_assigned), 0), 1) as value
          FROM gold.user_insights
          WHERE assignee IS NOT NULL
        position: {x: 9, y: 0, w: 3, h: 4}
      
      - name: "Workload vs Completion"
        type: "bar"
        dataset: "user_insights"
        query: |
          SELECT assignee, issues_assigned, issues_completed
          FROM gold.user_insights
          WHERE assignee IS NOT NULL
          ORDER BY issues_assigned DESC
        metrics: ["issues_assigned", "issues_completed"]
        group_by: ["assignee"]
        position: {x: 0, y: 4, w: 12, h: 8}
      
      - name: "Completion Rate"
        type: "bar"
        dataset: "user_insights"
        query: |
          SELECT assignee, 
            ROUND(100.0 * issues_completed / NULLIF(issues_assigned, 0), 1) as completion_rate
          FROM gold.user_insights
          WHERE assignee IS NOT NULL
          ORDER BY completion_rate DESC
        metrics: ["completion_rate"]
        group_by: ["assignee"]
        position: {x: 0, y: 12, w: 12, h: 8}

  - name: "Ticket Analysis"
    description: "Ticket aging and status analysis"
    charts:
      - name: "Total Tickets"
        type: "big_number"
        dataset: "ticket_aging"
        query: |
          SELECT COUNT(*) as value
          FROM gold.ticket_aging
        position: {x: 0, y: 0, w: 3, h: 4}
      
      - name: "Avg Age (days)"
        type: "big_number"
        dataset: "ticket_aging"
        query: |
          SELECT ROUND(AVG(days_in_status), 1) as value
          FROM gold.ticket_aging
        position: {x: 3, y: 0, w: 3, h: 4}
      
      - name: "Oldest Ticket"
        type: "big_number"
        dataset: "ticket_aging"
        query: |
          SELECT MAX(days_in_status) as value
          FROM gold.ticket_aging
        position: {x: 6, y: 0, w: 3, h: 4}
      
      - name: "Critical (>90d)"
        type: "big_number"
        dataset: "ticket_aging"
        query: |
          SELECT COUNT(CASE WHEN days_in_status > 90 THEN 1 END) as value
          FROM gold.ticket_aging
        position: {x: 9, y: 0, w: 3, h: 4}
      
      - name: "Tickets by Age Category"
        type: "bar"
        dataset: "ticket_aging"
        query: |
          SELECT 
            CASE
              WHEN days_in_status < 7 THEN '< 1 week'
              WHEN days_in_status < 30 THEN '1-4 weeks'
              WHEN days_in_status < 90 THEN '1-3 months'
              WHEN days_in_status < 180 THEN '3-6 months'
              ELSE '> 6 months'
            END AS age_bucket,
            COUNT(*) AS ticket_count
          FROM gold.ticket_aging
          GROUP BY 1
          ORDER BY MIN(days_in_status)
        metrics: ["ticket_count"]
        group_by: ["age_bucket"]
        position: {x: 0, y: 4, w: 6, h: 8}
      
      - name: "Tickets by Status"
        type: "bar"
        dataset: "ticket_aging"
        query: |
          SELECT status, COUNT(*) AS ticket_count
          FROM gold.ticket_aging
          GROUP BY status
          ORDER BY ticket_count DESC
        metrics: ["ticket_count"]
        group_by: ["status"]
        position: {x: 6, y: 4, w: 6, h: 8}
      
      - name: "Aging by Assignee"
        type: "bar"
        dataset: "ticket_aging"
        query: |
          SELECT assignee, ROUND(AVG(days_in_status), 1) AS avg_age
          FROM gold.ticket_aging
          WHERE assignee IS NOT NULL
          GROUP BY assignee
          ORDER BY avg_age DESC
        metrics: ["avg_age"]
        group_by: ["assignee"]
        position: {x: 0, y: 12, w: 12, h: 8}

